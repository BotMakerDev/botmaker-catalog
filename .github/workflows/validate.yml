name: Validate

# THE GATE. It runs the same checks the plugin's author ran locally, and it runs them by resolving
# `botmaker-cli`'s MAIN artifact — the library, with no picocli and no command line in it — and calling
# com.botmaker.cli.registry.RegistryGate.
#
# That is the whole design: a submission that fails for a reason its author could not have seen coming is
# the experience this gate exists to prevent, so the code cannot live here. What this workflow adds is the
# three things only the registry knows — every other entry's claimed ids, the coordinates of the plugins the
# host itself ships (BOTMAKER_BUNDLED_PLUGINS, below), and that index.json is generated.
#
# It is not a security review. A plugin runs arbitrary code inside Studio's process; every check asks
# whether a plugin WORKS. See README.md.

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'index.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit's parent, so `git diff` below is the pull request's own changes and not
          # everything since the branch point.
          fetch-depth: 0

      # No `cache: maven`. It keys the cache on **/pom.xml and fails the job outright when there is none —
      # `No file in … matched to [**/pom.xml], make sure you have checked out the target repository` — and
      # this is a data repository, which is the whole point of it. The pom the gate needs is written a step
      # later, into target/, so there is nothing here to key on at this point either. Found on the first
      # real pull request (#1, the SDK's own entry), where it failed before a single check had run.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Written to a FILE, never into a later `run:` line. A pull request chooses its own filenames, so a
      # path is attacker-controlled text: interpolating one into a shell command is a command injection, and
      # a path containing a space would break the argument list even without malice. The gate reads the list
      # itself, through its `@file` form.
      - name: What this pull request changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p target
          git diff --name-only "$BASE_SHA" HEAD > target/changed.txt
          cat target/changed.txt

      # Resolves the CLI as a LIBRARY. `dependency:build-classpath` on a throwaway pom rather than a
      # checkout: the gate must run the published code, because that is the code the author's own
      # `botmaker validate` also is.
      - name: Resolve botmaker-cli
        run: |
          mkdir -p target
          cat > target/gate-pom.xml <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.botmaker.registry</groupId>
              <artifactId>gate</artifactId>
              <version>0-SNAPSHOT</version>
              <packaging>pom</packaging>
              <repositories>
                  <repository>
                      <id>jitpack.io</id>
                      <url>https://jitpack.io</url>
                  </repository>
              </repositories>
              <dependencies>
                  <dependency>
                      <groupId>com.github.BotMakerDev</groupId>
                      <artifactId>botmaker-cli</artifactId>
                      <version>${env.BOTMAKER_CLI_VERSION}</version>
                  </dependency>
              </dependencies>
          </project>
          POM
          # An ABSOLUTE outputFile. A relative one resolves against the pom's own basedir, which is
          # target/ — so `-Dmdep.outputFile=target/gate-classpath.txt` wrote target/target/…, the mvn step
          # passed (it is -q and it did what it was told), and the next step died with
          # `cat: target/gate-classpath.txt: No such file or directory` followed by a ClassNotFoundException
          # for the gate itself. Found on pull request #1.
          mvn -B -q -f target/gate-pom.xml dependency:build-classpath \
              -DincludeScope=runtime -Dmdep.outputFile="$GITHUB_WORKSPACE/target/gate-classpath.txt"
          # The gate must not be reported as missing when what is missing is its classpath.
          test -s target/gate-classpath.txt
        env:
          # Pinned rather than floating: the gate's verdict must not change under a submission that is
          # already open. Bump it deliberately, in a pull request of its own, so a rule change is a commit
          # in this repository too.
          #
          # A released tag rather than main-SNAPSHOT, which is what stood here and never resolved: JitPack
          # builds a *tag* on demand, and this module's own poms carry a -SNAPSHOT on main, so a branch build is not the artifact the author's own
          # `botmaker validate` runs. v0.0.11 is the first release that also distinguishes an empty bundled
          # set from a missing one — see BOTMAKER_BUNDLED_PLUGINS below. v0.0.12 judged every plugin on an
          # entry's classpath as that entry's own, so the SDK, which brings basics, "claimed" basics' id and
          # value types and failed; v0.3.0 judges only the plugin an entry is about.
          BOTMAKER_CLI_VERSION: v0.3.0

      - name: Run the gate
        env:
          # The plugins the HOST ships, whose ids no submission may take. EMPTY, and that is a statement
          # rather than a disabled check: botmaker-studio has bundled no plugin since 2026-09-02. Every
          # plugin, the SDK included, is loaded off the open project's own resolved classpath. So there is
          # no id reserved outside this index, and `com.botmaker.sdk` is claimed the way every other id is —
          # by plugins/com.botmaker.sdk.json existing, which git itself enforces.
          #
          # Empty and UNSET are different, and the gate tells them apart (botmaker-cli v0.0.11 and newer).
          # Unset warns: nobody said, so a host's own plugins' ids would be unreserved without anyone having
          # decided that. Empty is silent: this host bundles nothing, and says so. Do not delete the line to
          # "mean the same thing" — it does not.
          #
          # If a host ever bundles a plugin again, name it here as a COORDINATE, not as a list of ids: the
          # gate resolves it and asks the plugin, so nothing here has to be kept in step with somebody
          # else's plugin ids. Name every bundled coordinate in one comma-separated value — they go on ONE
          # classpath, because a bundled plugin's own dependency may be `optional` and so not transitive,
          # and a classpath missing it is one that plugin cannot be constructed from. Pin them, for the same
          # reason BOTMAKER_CLI_VERSION is pinned.
          BOTMAKER_BUNDLED_PLUGINS: ""
        run: |
          java -cp "$(cat target/gate-classpath.txt)" \
               com.botmaker.cli.registry.RegistryGate . @target/changed.txt
