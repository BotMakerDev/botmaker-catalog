name: Validate

# THE CHECK. A pull request that passes is merged by automerge.yml with nobody reading it, so this is the only
# review an entry gets. Every rule is com.botmaker.cli.catalog.EntryGate, resolved from botmaker-cli's published
# library (tools/resolve-cli.sh) — the same checks `botmaker bot publish` and `botmaker plugin publish` run on the
# author's machine before they open the pull request.
#
# THE ENTRY'S OWN CODE RUNS IN THE LAST STEP, and that step holds no token. A plugin's constructor runs in the
# check's JVM and a bot is compiled with Maven, so EntryGate runs twice: `--part rules` (who controls the
# repository, the release, the file) with the read-only token, then `--part kind` (the build, the plugin's checks)
# with none. The checkout keeps no credentials either (persist-credentials: false).
#
# The tools come from the BASE tree (main), never the pull request's: one that edits tools/ or a workflow still
# gets a check, but it is not one entry file, so automerge.yml never merges it.
#
# It is not a security review. A bot or a plugin is a Java program somebody wrote; see README.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The job id is what tools/entry-facts.sh looks for among a commit's check runs. Renaming it is a change there.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Written to a FILE, never into a later `run:` line. A pull request chooses its own filenames, so the list
      # is attacker-controlled text; the check reads it itself through its `@file` form.
      #
      # The BASE tree beside it, because who controls an existing entry is read from what the catalog holds
      # today, and the pull request's copy says whatever it likes.
      - name: What this pull request changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p target
          git diff --name-only "$BASE_SHA" HEAD > target/changed.txt
          cat target/changed.txt
          git worktree add --detach target/base "$BASE_SHA"

      - name: Resolve botmaker-cli
        run: target/base/tools/resolve-cli.sh target/gate-classpath.txt

      - name: The rules (read-only token, no entry code)
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # The account id, which publishers.json names: an admin may change any entry and the ranks, and an
          # admin is told by id, since a login can be renamed and then taken.
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          java -cp "$(cat target/gate-classpath.txt)" com.botmaker.cli.catalog.EntryGate . \
               --base target/base --author "$AUTHOR" --author-id "$AUTHOR_ID" --part rules @target/changed.txt

      - name: The kind's checks (no token; the entry's code runs here)
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          java -cp "$(cat target/gate-classpath.txt)" com.botmaker.cli.catalog.EntryGate . \
               --base target/base --author "$AUTHOR" --part kind @target/changed.txt
