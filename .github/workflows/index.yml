name: Index

# Regenerates catalog.json from bots/, plugins/ and publishers.json, and commits it if it changed. It is the only
# thing that writes catalog.json, and catalog.json is the only file Studio reads.
#
# IT RUNS NO ENTRY'S CODE: com.botmaker.cli.catalog.IndexCommand reads GitHub's facts through the API and each
# pom at its tag as data, and checks every derived value again. So this job may hold a write token.
#
# Nightly as well, because a derived fact (a description, a renamed or deleted repository, a release taken down)
# changes on GitHub without any commit here. automerge.yml starts it by name after a merge: a merge made with the
# workflow's own token triggers no `push` workflow, by GitHub's design.

on:
  push:
    branches: [main]
    paths:
      - 'bots/**'
      - 'plugins/**'
      - 'publishers.json'
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve botmaker-cli
        run: tools/resolve-cli.sh "$RUNNER_TEMP/cli-classpath.txt"

      - name: Regenerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: java -cp "$(cat "$RUNNER_TEMP/cli-classpath.txt")" com.botmaker.cli.catalog.IndexCommand .

      # `git diff --quiet` rather than committing unconditionally: a no-op commit every night would make the
      # file's history say nothing about when the catalog actually changed. Pulled first because two merges can
      # land while this runs.
      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain -- catalog.json)" ]; then
            echo "catalog.json is already up to date."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "catalog: regenerate catalog.json"
          git pull --rebase
          git push
